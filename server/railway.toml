# Railway configuration for Node.js backend
# Set the service "Root Directory" to `server` (monorepo) or deploy from this folder.
# https://docs.railway.app/deploy/dockerfiles

[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
