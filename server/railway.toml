# Railway configuration for Node.js backend
# Set the service "Root Directory" to `server` (monorepo) or deploy from this folder.
# https://docs.railway.app/deploy/dockerfiles

[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "npm start"

[env]
NODE_ENV = "production"
