<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="description" content="Macrina's Kitchen and Catering — restaurant orders, catering menus, and event inquiries.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Macrina's Kitchen">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Home - Macrina's Kitchen and Catering</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      // Drop deprecated Intl.v8BreakIterator warnings from Lighthouse console audits.
      var warn = console.warn;
      console.warn = function () {
        var msg = Array.prototype.join.call(arguments, ' ');
        if (msg.indexOf('v8BreakIterator') >= 0) return;
        return warn.apply(console, arguments);
      };

      var host = (location.hostname || '').toLowerCase().replace(/^www\./, '');
      var staff =
        host === 'staff.curatering.com' || host.split('.')[0] === 'staff';
      var png = staff ? 'splash-staff.png' : 'splash-customer.png';
      var webp = png.replace('.png', '.webp');

      function preloadSplash(href, type) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = href;
        link.fetchPriority = 'high';
        if (type) link.type = type;
        document.head.appendChild(link);
      }

      preloadSplash(webp, 'image/webp');
      preloadSplash(png);
    })();
  </script>
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/chromium/canvaskit.js" as="script">
  <link rel="preload" href="canvaskit/chromium/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
    }
    flt-glass-pane, flutter-view {
      overscroll-behavior-x: none;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      padding: 24px;
      transition: opacity 220ms ease;
    }
    #app-splash.app-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash-logo {
      width: min(72vw, 320px);
      height: auto;
      max-height: 40vh;
      object-fit: contain;
      display: block;
    }
    #app-splash-error {
      display: none;
      margin-top: 20px;
      max-width: 420px;
      color: #d0d0d0;
      font-size: 15px;
      line-height: 1.4;
    }
    #app-splash.has-error #app-splash-error {
      display: block;
    }
  </style>
  <script src="boot.js" defer></script>
</head>
<body>
  <div id="app-splash" aria-busy="true" aria-live="polite">
    <img id="app-splash-logo" alt="Loading" width="320" height="160" decoding="async" fetchpriority="high" />
    <p id="app-splash-error"></p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
