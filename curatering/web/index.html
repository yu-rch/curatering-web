<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="description" content="Macrina's Kitchen and Catering - restaurant orders, catering menus, and event inquiries.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Macrina's Kitchen">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Home - Macrina's Kitchen and Catering</title>
  <link rel="manifest" href="manifest.json">
  <link rel="dns-prefetch" href="https://curatering.up.railway.app">
  <link rel="preconnect" href="https://curatering.up.railway.app" crossorigin>
  <script>/* Suppress noisy Flutter web console warnings; block deprecated Intl.v8BreakIterator. */
(function () {
  var suppressPatterns = [
    /v8BreakIterator/i,
    /Exception while loading service worker/i,
    /Loading the service worker using Flutter bootstrap is deprecated/i,
  ];

  function shouldSuppress(args) {
    try {
      var msg = Array.prototype.join.call(args, ' ');
      for (var i = 0; i < suppressPatterns.length; i++) {
        if (suppressPatterns[i].test(msg)) return true;
      }
    } catch (_) {}
    return false;
  }

  ['warn', 'error', 'info', 'debug'].forEach(function (level) {
    var original = console[level];
    if (typeof original !== 'function') return;
    console[level] = function () {
      if (shouldSuppress(arguments)) return;
      return original.apply(console, arguments);
    };
  });

  if (typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function') {
    try {
      Object.defineProperty(Intl, 'v8BreakIterator', {
        configurable: true,
        get: function () {
          return undefined;
        },
      });
    } catch (_) {}
  }
})();</script>
  <link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap" media="print">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap"></noscript>
  <script>/* Early splash image preload (CSP-safe external script). */
(function () {
  var host = (location.hostname || '').toLowerCase().replace(/^www\./, '');
  var staff =
    host === 'staff.curatering.com' || host.split('.')[0] === 'staff';
  var webp = staff ? 'splash-staff.webp' : 'splash-customer.webp';

  var link = document.createElement('link');
  link.rel = 'preload';
  link.as = 'image';
  link.href = webp;
  link.type = 'image/webp';
  link.fetchPriority = 'high';
  link.imageSizes = '320px';
  document.head.appendChild(link);
})();</script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
    }
    flt-glass-pane, flutter-view {
      overscroll-behavior-x: none;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      padding: clamp(12px, 4vw, 24px);
      transition: opacity 220ms ease;
    }
    #app-splash.app-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash-logo {
      display: block;
      width: min(90vw, 320px);
      height: auto;
      max-height: min(45vw, 160px);
      object-fit: contain;
    }
    #app-splash-error {
      display: none;
      margin-top: 20px;
      max-width: 420px;
      color: #d0d0d0;
      font-size: 15px;
      line-height: 1.4;
    }
    #app-splash.has-error #app-splash-error {
      display: block;
    }
  </style>
  <script src="boot.js" defer></script>
</head>
<body>
  <div id="app-splash" aria-busy="true" aria-live="polite">
    <img id="app-splash-logo" alt="Loading" width="320" height="160" sizes="320px" decoding="async" fetchpriority="high" />
    <p id="app-splash-error"></p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
