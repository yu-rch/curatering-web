<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="description" content="Macrina's Kitchen and Catering - restaurant orders, catering menus, and event inquiries.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Macrina's Kitchen">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Home - Macrina's Kitchen and Catering</title>
  <link rel="manifest" href="manifest.json">
  <link rel="dns-prefetch" href="https://curatering.up.railway.app">
  <link rel="preconnect" href="https://curatering.up.railway.app" crossorigin>
  <!-- External only: CSP blocks inline scripts / on* handlers. -->
  <script src="console_filter.js"></script>
  <script src="splash_preload.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
    }
    flt-glass-pane, flutter-view {
      overscroll-behavior-x: none;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      text-align: center;
      padding: clamp(12px, 4vw, 24px);
      transition: opacity 220ms ease;
    }
    #app-splash.app-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash-logo {
      display: block;
      width: min(90vw, 320px);
      height: auto;
      max-height: min(45vw, 160px);
      object-fit: contain;
    }
    #app-splash-error {
      display: none;
      margin-top: 20px;
      max-width: 420px;
      color: #d0d0d0;
      font-size: 15px;
      line-height: 1.4;
    }
    #app-splash.has-error #app-splash-error {
      display: block;
    }
  </style>
  <script src="boot.js" defer></script>
</head>
<body>
  <div id="app-splash" aria-busy="true" aria-live="polite">
    <img id="app-splash-logo" alt="Loading" width="320" height="160" sizes="320px" decoding="async" fetchpriority="high" />
    <p id="app-splash-error"></p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
