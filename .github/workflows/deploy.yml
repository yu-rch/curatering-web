name: Build & Deploy Flutter Web

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: cd curatering && flutter pub get

      - name: Install Vercel CLI
        run: cd curatering && flutter build web --release

      - name: Deploy to Vercel
        run: cd curatering/build/web --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
