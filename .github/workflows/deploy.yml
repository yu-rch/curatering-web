name: Build & Deploy Flutter Web

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: curatering
        run: flutter pub get

      - name: Build web
        working-directory: curatering
        run: |
          flutter build web --release \
            --web-renderer html \
            --tree-shake-icons \
            --source-maps \
            --pwa-strategy none \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Patch deprecated Intl.v8BreakIterator feature detect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('curatering/build/web')
          for name in ('flutter.js', 'flutter_bootstrap.js'):
              path = root / name
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              path.write_text(
                  text.replace('Intl.v8BreakIterator', 'Intl.Segmenter'),
                  encoding='utf-8',
              )
          PY

      - name: Install Vercel CLI
        run: npm i -g vercel

      # Deploy directory is build/web — copy routing config so SPA fallback
      # never rewrites real .js/.json/.wasm assets to index.html.
      - name: Copy Vercel config into web build
        run: cp curatering/vercel.json curatering/build/web/vercel.json

      - name: Deploy to Vercel
        working-directory: curatering/build/web
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --scope urichs-projects-360c4d2f

