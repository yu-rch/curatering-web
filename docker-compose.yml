version: '3.8'
services:
  fastapi-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: curatering-ai:latest
    container_name: curatering-ai
    environment:
      - YOLO_MODEL_PATH=/app/models/best.pt
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - UVICORN_WORKERS=1
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '2.0'
        reservations:
          memory: 6G
          cpus: '1.0'

  node-api:
    image: node:18-slim
    container_name: curatering-server
    working_dir: /workspace/server
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install --silent; fi && node src/index.js"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    env_file:
      - ./server/.env
    environment:
      - AI_SERVICE_BASE_URL=http://fastapi-ai:8000
      - PG_POOL_MAX=25
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./server:/workspace/server
      - node-node_modules:/workspace/server/node_modules
      - ./curatering/build/web:/workspace/server/curatering/build/web:ro
    ports:
      - "3000:3000"
    depends_on:
      - fastapi-ai
    init: true
    restart: unless-stopped

volumes:
  node-node_modules:
