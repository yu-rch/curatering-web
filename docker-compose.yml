services:
  node-api:
    image: node:20
    working_dir: /workspace/server
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi && npm run dev"
    # Helps when Docker’s resolver flakes on external hostnames (e.g. *.pooler.supabase.com).
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    env_file:
      - ./server/.env
    environment:
      AI_SERVICE_BASE_URL: http://fastapi-ai:8000
      PG_POOL_MAX: 25
      DATABASE_URL: postgresql://postgres.ffgifzwwqdjeyyedaciu:SEJKhvkLLJOZXLwv@aws-1-ap-southeast-2.supabase.com:5432/postgres
    volumes:
      - ./server:/workspace/server
      - node-node_modules:/workspace/server/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - fastapi-ai
    init: true

  fastapi-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/models:/app/models
    init: true
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
        reservations:
          memory: 4G
          cpus: '1.0'
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_WORKERS=1
      - UVICORN_WORKER_CONNECTIONS=10

volumes:
  node-node_modules:
