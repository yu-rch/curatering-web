services:
  node-api:
    image: node:20
    working_dir: /workspace/server
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi && npm run dev"
    env_file:
      - ./server/.env
    environment:
      AI_SERVICE_BASE_URL: http://fastapi-ai:8000
    volumes:
      - ./server:/workspace/server
      - node-node_modules:/workspace/server/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - fastapi-ai
    init: true

  fastapi-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    command: sh -c "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/models:/app/models
    init: true

volumes:
  node-node_modules:
